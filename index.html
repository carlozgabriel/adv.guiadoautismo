    <!-- RECUPERAÇÃO DE VENDAS: BACK-REDIRECT       -->
    <!-- Se o visitante tentar sair, redireciona para a oferta de 16€ na LP unificada -->
    <!-- ========================================== -->
    <script>
      (function() {
        function getBackRedirectUrl() {
          try {
            var url = new URL(window.location.href);
            url.searchParams.set('step', 'lp');
            url.hash = '#oferta';
            return url.toString();
          } catch(e) {
            return window.location.pathname + '?step=lp#oferta';
          }
        }

        history.pushState({}, '', location.href);
        history.pushState({}, '', location.href);

        window.addEventListener('popstate', function() {
          if (!window.location.search.includes('step=lp') && !window.location.hash.includes('oferta')) {
            setTimeout(function() {
              location.href = getBackRedirectUrl();
            }, 1);
          }
        });
      })();
